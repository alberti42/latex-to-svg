# Byte-compilation, checkdoc and the ERT suite, on every push to main and
# every pull request.
#
# The five packages in this repository (`latex-to-svg-frontend' and its
# `latex-to-svg-for-org' / `latex-to-svg-for-markdown' /
# `latex-to-svg-for-latex' / `latex-to-svg-for-gnus' adaptors) all load
# the backend, `latex-to-svg-backend'.  package.el installs it from MELPA,
# which is where a user gets it too, so a backend change that breaks this
# front-end shows up here rather than in a user's report.  Every later step
# calls `package-initialize' to put it on the load-path.
#
# The suite stubs the backend and detects math with a regexp scanner, so it
# needs no TeX toolchain, no graphical display and no tree-sitter grammar;
# the one test that needs a Markdown major mode skips itself without one.
# AUCTeX is installed from GNU ELPA for the one test that runs it.
#
# The matrix is the declared floor (29.1, the `Package-Requires' of all
# four files), then the newest of each series, then master.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['29.1', '29.4', '30.2', '31.1', 'snapshot']
    name: Emacs ${{ matrix.emacs_version }}
    # A snapshot Emacs breaks for reasons that are not this package's;
    # it is here as early warning, not as a gate.
    continue-on-error: ${{ matrix.emacs_version == 'snapshot' }}
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Report version
        run: emacs --version | head -1

      # `package-refresh-contents' downloads MELPA's archive-contents in one
      # piece.  A truncated response leaves package.el reporting "Failed to
      # download 'melpa' archive: End of file during parsing" and carrying on
      # with no MELPA package registered, so the install below fails on an
      # otherwise healthy runner.  Fetch again rather than trust one request.
      - name: Install the backend from MELPA
        run: |
          for attempt in 1 2 3; do
            if emacs -Q -batch --eval '(progn
              (require (quote package))
              (add-to-list (quote package-archives)
                           (cons "melpa" "https://melpa.org/packages/") t)
              (package-initialize)
              (package-refresh-contents)
              (package-install (quote latex-to-svg-backend)))'; then
              exit 0
            fi
            echo "MELPA fetch failed (attempt $attempt of 3); retrying in 15s"
            sleep 15
          done
          exit 1

      # AUCTeX, from GNU ELPA, for the one LaTeX adaptor test that runs the
      # real AUCTeX (the others fake what they need from it).  Retried like
      # the MELPA fetch above, but allowed to fail: when GNU ELPA is down,
      # that test skips itself and the rest of the run still counts.
      - name: Install AUCTeX from GNU ELPA
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            if emacs -Q -batch --eval '(progn
              (require (quote package))
              (package-initialize)
              (package-refresh-contents)
              (package-install (quote auctex)))'; then
              exit 0
            fi
            echo "GNU ELPA fetch failed (attempt $attempt of 3); retrying in 15s"
            sleep 15
          done
          exit 1

      # The test file is compiled too: a variable a test binds with `let'
      # and nothing declares compiles as a lexical binding, which loading
      # the source does not catch.
      - name: Byte-compile, warnings as errors
        run: |
          emacs -Q -batch \
            --eval '(progn (require (quote package)) (package-initialize))' \
            --eval '(setq byte-compile-error-on-warn t)' \
            -L . -f batch-byte-compile \
            latex-to-svg-frontend.el \
            latex-to-svg-for-org.el \
            latex-to-svg-for-markdown.el \
            latex-to-svg-for-latex.el \
            latex-to-svg-for-gnus.el \
            tests/latex-to-svg-frontend-tests.el

      # Docstring conventions, exiting non-zero on any finding.  Both flags
      # are set rather than left at their defaults, so the step reports the
      # same thing on every Emacs: the experimental verb check defaults to t
      # up to Emacs 30 and nil from 31.
      - name: Checkdoc
        run: |
          emacs -Q -batch --eval '(progn
            (require (quote checkdoc))
            (setq checkdoc-force-docstrings-flag nil)
            (setq checkdoc-verb-check-experimental-flag nil)
            (dolist (file (list "latex-to-svg-frontend.el"
                                "latex-to-svg-for-org.el"
                                "latex-to-svg-for-markdown.el"
                                "latex-to-svg-for-latex.el"
                                "latex-to-svg-for-gnus.el"))
              (checkdoc-file file))
            (if (get-buffer "*Warnings*")
                (kill-emacs 1)
              (message "checkdoc: clean")))'

      - name: ERT
        run: |
          emacs -Q -batch \
            --eval '(progn (require (quote package)) (package-initialize))' \
            -L . -l ert -l tests/latex-to-svg-frontend-tests.el \
            -f ert-run-tests-batch-and-exit

  # Before a release: when the version in the headers has no tag yet, this
  # commit is (or leads up to) a release, so run the checks that need
  # MELPA Stable (scripts/release-check.el): the frontend must require the
  # newest backend there, and CHANGELOG.md must have the version's dated
  # section.  After the tag exists, ordinary pushes skip it.  One Emacs is
  # enough; the result does not depend on the Emacs version.
  # `latex-to-svg-frontend--text-foreground' follows two functions of
  # Emacs's faces.el; tests/fixtures/emacs-faces-attribute-at-point.el holds
  # a copy of them.  On Emacs snapshot, where they would change first, this
  # compares them with the copy and prints a diff when they differ.  A
  # change in Emacs is no failure of this package, so the job may fail.
  emacs-faces:
    runs-on: ubuntu-latest
    name: Emacs faces.el vs. our copy
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: snapshot

      - name: Compare faces--attribute-at-point and foreground-color-at-point
        run: emacs -Q -batch -l scripts/emacs-faces-check.el

  release-check:
    runs-on: ubuntu-latest
    name: Release check
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: '30.2'

      - name: Check a version not yet tagged
        run: |
          version=$(sed -n 's/^;; Version: //p' latex-to-svg-frontend.el)
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged; nothing to check before a release."
          else
            echo "v$version is not tagged yet; checking it as a release."
            emacs -Q -batch -l scripts/release-check.el
          fi
