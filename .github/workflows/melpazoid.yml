---

# The checks MELPA's reviewers run, on every push: melpazoid
# <https://github.com/riscy/melpazoid> byte-compiles the package as
# package-build would, runs package-lint and checkdoc over it, and looks
# for the habits MELPA asks packages to avoid.
#
# The CI job byte-compiles and runs checkdoc against the Emacs of the
# runner.  This job runs them against MELPA's own recipe and a current
# checkout of package-lint, which is where a symbol newer than the
# declared Emacs floor shows up.
#
# This repository ships six packages, each with its own MELPA recipe, so
# the job runs once per recipe: what is checked is one package and the
# single file that recipe ships, not the checkout as a whole.
#
# It fails the build only on errors.

name: melpazoid

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  melpazoid:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: latex-to-svg-frontend
            recipe: '(latex-to-svg-frontend :fetcher github :repo "alberti42/latex-to-svg" :files ("latex-to-svg-frontend.el"))'
          - package: latex-to-svg-for-org
            recipe: '(latex-to-svg-for-org :fetcher github :repo "alberti42/latex-to-svg" :files ("latex-to-svg-for-org.el"))'
          - package: latex-to-svg-for-markdown
            recipe: '(latex-to-svg-for-markdown :fetcher github :repo "alberti42/latex-to-svg" :files ("latex-to-svg-for-markdown.el"))'
          - package: latex-to-svg-for-latex
            recipe: '(latex-to-svg-for-latex :fetcher github :repo "alberti42/latex-to-svg" :files ("latex-to-svg-for-latex.el"))'
          - package: latex-to-svg-for-gnus
            recipe: '(latex-to-svg-for-gnus :fetcher github :repo "alberti42/latex-to-svg" :files ("latex-to-svg-for-gnus.el"))'
          - package: latex-to-svg-for-elfeed
            recipe: '(latex-to-svg-for-elfeed :fetcher github :repo "alberti42/latex-to-svg" :files ("latex-to-svg-for-elfeed.el"))'
    name: MELPA checks (${{ matrix.package }})
    # A passing job takes about 2 minutes.  Without a limit, a stalled
    # apt-get keeps the job running for GitHub's default of 6 hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # melpazoid.py runs `emacs --batch' on the runner as well as in its
      # container.  `emacs-nox' without recommends is far fewer packages
      # than `emacs', and the man-db trigger, which runs after every
      # install on the runner image, is turned off: both are where the
      # install has stalled.
      - name: Install melpazoid
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends emacs-nox
          emacs --version
          git clone https://github.com/riscy/melpazoid.git ~/melpazoid
          pip install ~/melpazoid

      # melpazoid installs latex-to-svg-backend from MELPA, which has
      # develop's backend floor only once the backend is released.  Until
      # then the file signals when it is loaded, and melpazoid fails on
      # that alone.  On develop, and on a pull request from it, lower the
      # floor in this checkout to 0.16.1, the oldest backend with
      # `latex-to-svg-backend-version', so that melpazoid checks the rest
      # against the backend MELPA has.  Only the front-end's job ships
      # latex-to-svg-frontend.el.
      - name: Lower the backend floor to the backend on MELPA
        if: >-
          matrix.package == 'latex-to-svg-frontend'
          && (github.ref_name == 'develop' || github.head_ref == 'develop')
        run: |
          sed -i 's/^(defconst latex-to-svg-frontend--backend-version "[0-9.]*"$/(defconst latex-to-svg-frontend--backend-version "0.16.1"/' \
            latex-to-svg-frontend.el
          grep -n '^(defconst latex-to-svg-frontend--backend-version "0.16.1"$' \
            latex-to-svg-frontend.el

      - name: Run melpazoid
        env:
          LOCAL_REPO: ${{ github.workspace }}
          # The recipe MELPA itself builds from, so that what is checked
          # here is what MELPA ships.
          RECIPE: ${{ matrix.recipe }}
          # A package of this repository that is on MELPA already would
          # otherwise be reported as a problem.
          EXIST_OK: 'true'
        run: make -C ~/melpazoid
